# Workspace root for the SBOMBox CLI. Not a package itself: the two published
# packages live in packages/core (sbombox-core) and packages/cli (sbombox).
[tool.uv.workspace]
members = ["packages/*"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "A", "SIM", "TCH"]

[tool.ruff.lint.flake8-type-checking]
# Pydantic resolves a model's field annotations when the class is created, so an
# import used only inside those annotations is a runtime requirement, not a
# typing-only one.
runtime-evaluated-base-classes = ["pydantic.BaseModel"]
runtime-evaluated-decorators = ["pydantic.field_validator", "pydantic.model_validator"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["packages/core/tests", "packages/cli/tests"]
addopts = "--tb=short -q"
