name: Publish to PyPI

# Push a tag like `v0.1.0` to publish sbombox-core and sbombox (the CLI) to
# PyPI. https://sbombox.com/install.sh installs whatever is published here.
#
# What a release leaves behind, for anyone auditing it later:
#   * PyPI uploads via trusted publishing (no stored token) with PEP 740
#     attestations, plus a GitHub build-provenance attestation for each file
#     (`gh attestation verify <file> --repo sbombox-hq/cli`).
#   * A GitHub Release with the wheels, sdists, SHA256SUMS and the CLI's own
#     SBOM, generated and scored by the CLI being released.
#
# After a release, the API's /v1/meta/cli reports the newest PyPI release as
# current unless CLI_LATEST_VERSION is set on the API. To force everyone off an
# old or unsafe version, raise CLI_MIN_SUPPORTED_VERSION there.
#
# One-time setup: on pypi.org add a trusted publisher for both projects
# (sbombox-core and sbombox): owner SBOMBox-HQ, repository cli, workflow
# publish.yml, environment pypi. PyPI allows only one *pending* publisher per
# configuration, so the first release takes two steps (README.md, "First
# release"). Add required reviewers to the `pypi` environment if releases
# should need a second person's approval.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write      # build-provenance attestation
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - name: Check tag matches package versions
        run: |
          tag="${GITHUB_REF_NAME#v}"
          for f in packages/core/pyproject.toml packages/cli/pyproject.toml; do
            v=$(sed -n 's/^version = "\(.*\)"/\1/p' "$f" | head -1)
            [ "$v" = "$tag" ] || { echo "::error file=$f::$f is $v, tag is $tag"; exit 1; }
          done
      - name: Test before publishing
        run: |
          uv sync --all-packages --all-extras --frozen
          uv run pytest
      - run: uv build --package sbombox-core -o dist
      - run: uv build --package sbombox -o dist
      - name: Smoke-test the CLI wheel
        run: |
          uv tool install --find-links dist sbombox
          sbombox --version
      - name: SBOM of the release, made by the release
        run: |
          # The released CLI is already installed; the installer adds only the
          # generator (syft).
          curl -fsSL https://sbombox.com/install.sh | SBOMBOX_SKIP_CLI=1 SBOMBOX_NO_MODIFY_PATH=1 sh
          mkdir -p release
          sbombox generate --dir packages/cli --output release/sbombox-cli.cdx.json
          sbombox score release/sbombox-cli.cdx.json --format detailed
      - name: Checksums
        run: (cd dist && sha256sum -- *) > release/SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/*"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-extras
          path: release/

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      # sbombox-core goes first: the CLI depends on it, and on the very first
      # release only sbombox-core can have a (pending) trusted publisher - see
      # "First release" in README.md. skip-existing makes a re-run after a
      # partial publish safe; the tag check above stops a version being reused.
      - name: Split packages
        run: |
          mkdir -p pkg/core pkg/cli
          mv dist/sbombox_core-* pkg/core/
          mv dist/sbombox-* pkg/cli/
      - name: Publish sbombox-core
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          packages-dir: pkg/core/
          skip-existing: true
      - name: Publish sbombox
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          packages-dir: pkg/cli/
          skip-existing: true

  release:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: assets/
          merge-multiple: true
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "SBOMBox CLI ${TAG#v}" \
            --generate-notes \
            --verify-tag
