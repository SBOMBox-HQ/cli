name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
      # Errors only (syntax, undefined names); the full rule set still has
      # pre-existing findings. Tighten this as they are cleaned up.
      - run: uvx ruff check packages --select E9,F63,F7,F82 --output-format github
      - run: uv sync --all-packages --all-extras --frozen
      - run: uv run pytest --junitxml=reports/tests.xml
      - name: Build wheels
        run: |
          uv build --package sbombox-core -o dist
          uv build --package sbombox -o dist
      - name: Smoke-test the CLI wheel
        run: |
          uv tool install --find-links dist sbombox
          sbombox --version
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: test-results
          path: reports/
          retention-days: 30
