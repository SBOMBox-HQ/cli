[project]
name = "sbombox"
version = "0.1.1"
description = "SBOMBox CLI - generate, score, and manage SBOMs from the command line"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "sia-sbombox", email = "sia@sbombox.com" }]
maintainers = [{ name = "sia-sbombox", email = "sia@sbombox.com" }]
dependencies = [
    "sbombox-core",
    "typer>=0.12",
    "rich>=13.0",
    "httpx>=0.27",
    "keyring>=25.0",
    "ruamel.yaml>=0.18",
]

[project.optional-dependencies]
sigstore = ["sbombox-core[sigstore]"]
# cyclonedx-bom provides cyclonedx-py, the generator the end-to-end `sbombox check` tests run.
dev = ["pytest>=8.0", "ruff>=0.4", "mypy>=1.10", "cyclonedx-bom>=7.0"]

[project.scripts]
sbombox = "sbombox_cli.main:run"

[project.urls]
Homepage = "https://sbombox.com"
Documentation = "https://sbombox.com/docs/cli"
Source = "https://github.com/sbombox-hq/cli"
Issues = "https://github.com/sbombox-hq/cli/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sbombox_cli"]

[tool.uv.sources]
sbombox-core = { workspace = true }
