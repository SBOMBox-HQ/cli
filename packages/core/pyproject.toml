[project]
name = "sbombox-core"
version = "0.1.2"
description = "SBOMBox core library - parse, validate, score, and check compliance of SBOMs"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "sia-sbombox", email = "sia@sbombox.com" }]
maintainers = [{ name = "sia-sbombox", email = "sia@sbombox.com" }]
dependencies = [
    "pydantic>=2.0",
    "packageurl-python>=0.11",
    "license-expression>=30.0",
    "univers>=0.21",
    "jsonschema>=4.20",
    "ruamel.yaml>=0.18",
    "lxml>=5.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
sigstore = ["sigstore>=3.0"]
cyclonedx = ["cyclonedx-python-lib>=8.0"]
spdx = ["spdx-tools>=0.8"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.4", "mypy>=1.10"]

[project.urls]
Homepage = "https://sbombox.com"
Documentation = "https://sbombox.com/docs/cli"
Source = "https://github.com/sbombox-hq/cli"
Issues = "https://github.com/sbombox-hq/cli/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sbombox_core"]
