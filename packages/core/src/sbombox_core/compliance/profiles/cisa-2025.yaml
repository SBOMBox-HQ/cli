name: CISA SBOM Guidelines
version: "2025"
description: >
  CISA SBOM Guidelines (2025) - recommended data elements for SBOMs
  used in U.S. federal procurement and critical infrastructure.
requirements:
  - id: cisa-1
    title: "Component name"
    section_ref: "1"
    level: required
    check: name_present
  - id: cisa-2
    title: "Component version"
    section_ref: "2"
    level: required
    check: version_present
  - id: cisa-3
    title: "Component purl"
    section_ref: "3"
    level: required
    check: purl_present
  - id: cisa-4
    title: "Supplier information"
    section_ref: "4"
    level: required
    check: supplier_present
  - id: cisa-5
    title: "Hash digests"
    section_ref: "5"
    level: required
    check: hashes_present
  - id: cisa-6
    title: "License information"
    section_ref: "6"
    level: required
    check: licenses_present
  - id: cisa-7
    title: "Dependency graph"
    section_ref: "7"
    level: required
    check: dependency_graph
  - id: cisa-8
    title: "SBOM timestamp"
    section_ref: "8"
    level: required
    check: metadata_timestamp
  - id: cisa-9
    title: "Root component"
    section_ref: "9"
    level: optional
    check: root_component
  - id: cisa-10
    title: "No embedded vulnerability claims"
    section_ref: "10"
    level: optional
    check: no_embedded_vulns
